spring:
  application:
    name: integration-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/integration_db}
    username: ${SPRING_DATASOURCE_USERNAME:integration_user}
    password: ${SPRING_DATASOURCE_PASSWORD:integration_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:integration_user}
    password: ${SPRING_RABBITMQ_PASSWORD:integration_password}
    # Shared default vhost with the other services — isolation is by queue-name
    # convention (auth.*, profile.*, integration.*), not by RabbitMQ vhost.
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        # A listener failure is retried in-process, then dead-lettered to <queue>.dlq
        # (see RabbitConfig) instead of being redelivered forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s

logging:
  level:
    root: INFO
    ru.provless.integration: DEBUG

# Shared secret authenticating inbound /internal/* requests (from profile-service).
# Same mesh-wide key already used between auth-service and phone-auth.
internal:
  api-key: ${INTERNAL_API_KEY:dev-internal-api-key-change-me}

profile-service:
  base-url: ${PROFILE_SERVICE_URL:http://localhost:8080}
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-api-key-change-me}
  connect-timeout-ms: 2000
  read-timeout-ms: 15000

yandex:
  ocr:
    # Секреты — из mesoreal-secrets. Folder ID тоже сюда: по факту это идентификатор
    # каталога, привязанного к конкретному Yandex Cloud аккаунту/биллингу — считаем
    # его чувствительным наравне с api-key, а не публичной настройкой.
    api-key: ${YANDEX_OCR_API_KEY:}
    folder-id: ${YANDEX_FOLDER_ID:}
    poll-interval-ms: ${YANDEX_OCR_POLL_INTERVAL_MS:1000}
    # Budget for submit + poll, kept under precheck.timeout-ms so profile-service's
    # own timeout never fires first — see umc/document-verification-plan.md "Бюджет".
    poll-deadline-ms: 27000
    connect-timeout-ms: 2000
    read-timeout-ms: 10000

# Public URL other systems (amoCRM, a manager's browser) use to reach this service —
# unlike PROFILE_SERVICE_URL, this can't be the internal cluster DNS name.
integration:
  public-base-url: ${INTEGRATION_PUBLIC_BASE_URL:http://localhost:8091}

# amoCRM — проверка документов физлица в УМЦ (front requests S5 §10): сделка в воронке «Проверка документов» после precheck,
# вебхук смены этапа → решение в profile-service. Не секреты, а настройки аккаунта: ConfigMap mesoreal-config (AMOCRM_*), на test —
# своя воронка в том же аккаунте. Пусто — amoCRM не настроен: сделки не создаются (AmoCrmClient.configured()). Как настроить
# воронку и поля — mesoreal-k8s readme, «amoCRM».
amocrm:
  subdomain: ${AMOCRM_SUBDOMAIN:}
  # OAuth client id — публичный идентификатор интеграции, не секрет (в отличие от client-secret ниже).
  client-id: ${AMOCRM_CLIENT_ID:}
  redirect-uri: ${AMOCRM_REDIRECT_URI:}
  pipeline-id: ${AMOCRM_PIPELINE_ID:}
  stage-approved-id: ${AMOCRM_STAGE_APPROVED_ID:}
  stage-rejected-id: ${AMOCRM_STAGE_REJECTED_ID:}
  # Comma-separated allowlist. Пусто = выключено (amoCRM не публикует фиксированный список исходящих IP).
  webhook-ip-allowlist: ${AMOCRM_WEBHOOK_IP_ALLOWLIST:}
  field-document-type-id: ${AMOCRM_FIELD_DOCUMENT_TYPE_ID:}
  field-document-id-id: ${AMOCRM_FIELD_DOCUMENT_ID_ID:}
  field-file-link-id: ${AMOCRM_FIELD_FILE_LINK_ID:}
  field-ocr-confidence-id: ${AMOCRM_FIELD_OCR_CONFIDENCE_ID:}
  # Решение менеджера: «Причина отклонения» (список — значения сервис сам держит равными Directus), «Комментарий», «Резюме диплома».
  field-reason-id: ${AMOCRM_FIELD_REASON_ID:}
  field-comment-id: ${AMOCRM_FIELD_COMMENT_ID:}
  field-summary-id: ${AMOCRM_FIELD_SUMMARY_ID:}
  connect-timeout-ms: 2000
  read-timeout-ms: 10000

  # Настоящие секреты — только из mesoreal-secrets (k8s Secret), никогда не хардкодим.
  client-secret: ${AMOCRM_CLIENT_SECRET:}
  refresh-token: ${AMOCRM_REFRESH_TOKEN:}
  # Secret embedded in the webhook callback URL path itself (POST /webhooks/amocrm/documents/{secret}),
  # not a header — amoCRM's classic webhooks don't reliably sign their payload.
  webhook-secret: ${AMOCRM_WEBHOOK_SECRET:}

# Проверка документов и плательщиков (front requests S5 §10): документы профиля организации и плательщики ООО / ИП — заявки в
# inbox Chatwoot «Проверка документов» (отдел продаж), решение — вкладка панели. Причины отклонения — Directus «Причины отклонения».
review:
  inbox-name: ${REVIEW_INBOX_NAME:Проверка документов}
  reasons-interval: PT5M
  retry-interval: PT5M

# Chatwoot (менеджерский чат): контакт приложения при регистрации — один телефон = один контакт,
# приложение = ещё один канал контакта (inbox «Приложение»). План:
# docs/backend/artifacts/shop/chatwoot/plan-app-contact-merge.md
chatwoot:
  enabled: ${CHATWOOT_ENABLED:false}
  base-url: ${CHATWOOT_URL:http://localhost:3000}
  account-id: ${CHATWOOT_ACCOUNT_ID:}
  # Токен отдельного сервисного пользователя-администратора Chatwoot, не личный.
  api-token: ${CHATWOOT_API_TOKEN:}
  # The address people open Chatwoot at (links in Directus «Заказы»); empty — no links.
  public-url: ${CHATWOOT_PUBLIC_URL:}
  app-inbox-name: ${CHATWOOT_APP_INBOX_NAME:Входящие - Приложение}
  # Earlier names of that inbox (comma-separated): found under one of them, it is renamed to app-inbox-name.
  app-inbox-legacy-name: Приложение,Приложение — входящие
  # Пусто — найти inbox по имени или создать.
  app-inbox-id: ${CHATWOOT_APP_INBOX_ID:}
  # App chat connector (docs/backend/artifacts/messenger/plan-chat-connector.md): chat.outbound ↔ Chatwoot ↔ chat.inbound.
  chat:
    # Departments (plan-chat-departments.md): a label on a request moves it to the department's inbox. Inboxes are found by
    # name or created; who is in them is set in Chatwoot. Labels are lowercase (Chatwoot stores them so).
    departments:
      - key: sales
        label: для-продаж
        inbox-name: Продажи - Приложение
      - key: umc
        label: для-умц
        inbox-name: УМЦ - Приложение
    # Where Chatwoot sends the app inbox's webhook. Inside the cluster: Chatwoot already reaches in-cluster Services
    # (SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true for the bridges); the path is not published by Traefik.
    webhook-url: ${CHATWOOT_CHAT_WEBHOOK_URL:http://integration-service:8080/webhooks/chatwoot/app}
    # A webhook older than this is refused (its signature covers the timestamp).
    webhook-max-age: 5m
    # Retry pause while Chatwoot is down: doubles from the first to the max, forever (the queue waits, order kept).
    retry-initial: 2s
    retry-max: 60s
    # Polls (Chatwoot sends no events for these), ISO-8601: what @Scheduled reads. The first runs after the delay.
    poll-initial-delay: PT15S
    read-poll-interval: PT5S
    agents-poll-interval: PT30S
    hours-poll-interval: PT10M
  # The chat-service attachment bucket — Chatwoot's bucket, with Chatwoot's key (chatwoot-secrets STORAGE_*).
  chat-storage:
    endpoint: ${CHAT_S3_ENDPOINT:https://storage.yandexcloud.net}
    region: ${CHAT_S3_REGION:ru-central1}
    bucket: ${CHAT_S3_BUCKET:chatwoot-mesoreal-app}
    prefix: ${CHAT_S3_PREFIX:app-chat/}
    access-key: ${CHAT_S3_ACCESS_KEY:}
    secret-key: ${CHAT_S3_SECRET_KEY:}
  connect-timeout-ms: 2000
  read-timeout-ms: 10000

# catalog-service internal API (X-Internal-Auth = internal.api-key): the whole order for the managers (orders/plan-manager.md).
catalog-service:
  base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}

# auth-service internal API (X-Internal-Auth = internal.api-key): account by phone, for personal managers.
auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  connect-timeout-ms: 2000
  read-timeout-ms: 5000

# Directus (CMS): personal managers (docs/backend/artifacts/personal-manager/plan.md). The collections, the policy and the
# service user — tools/directus_personal_managers.py; its token is a secret. Empty url or token — the sync is off.
directus:
  url: ${DIRECTUS_URL:}
  token: ${INTEGRATION_DIRECTUS_TOKEN:}
  # The service user's login: its own writes into a row are not taken for an assignment.
  service-email: integration-service@mesoreal.ru

personal-manager:
  poll-initial-delay: PT30S
  managers-poll-interval: PT5M
  assignments-poll-interval: PT1M

# Graduates (front requests S5 §6): Directus «Выпускники» → profile-service is_graduate.
graduates:
  poll-interval: PT5M

# The managers' panel «Заказы клиента» (orders/plan-manager.md §2.2): a tab of the Chatwoot conversation with our page. url — its
# public address without the key; the service registers it in Chatwoot (as a Dashboard App) with ?key=<key>. Empty — no panel.
manager-panel:
  url: ${MANAGER_PANEL_URL:}
  key: ${MANAGER_PANEL_KEY:}

# The site (Django): the sales department's letter about a new order (orders/task-site-order-email.md). The same address and token as
# auth-service's account deletion requests (AUTH_SITE_URL in mesoreal-config, AUTH_SITE_TOKEN in mesoreal-secrets). Empty — no letters.
site:
  url: ${AUTH_SITE_URL:}
  token: ${AUTH_SITE_TOKEN:}
  # The site's method is not made yet (next sprint): letters are off until ORDER_LETTERS_ENABLED=true in mesoreal-config.
  order-letters: ${ORDER_LETTERS_ENABLED:false}
