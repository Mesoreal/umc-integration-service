spring:
  application:
    name: integration-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/integration_db}
    username: ${SPRING_DATASOURCE_USERNAME:integration_user}
    password: ${SPRING_DATASOURCE_PASSWORD:integration_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:integration_user}
    password: ${SPRING_RABBITMQ_PASSWORD:integration_password}
    # Shared default vhost with the other services — isolation is by queue-name
    # convention (auth.*, profile.*, integration.*), not by RabbitMQ vhost.
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        # A listener failure is retried in-process, then dead-lettered to <queue>.dlq
        # (see RabbitConfig) instead of being redelivered forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s

logging:
  level:
    root: INFO
    ru.provless.integration: DEBUG

# Shared secret authenticating inbound /internal/* requests (from profile-service).
# Same mesh-wide key already used between auth-service and phone-auth.
internal:
  api-key: ${INTERNAL_API_KEY:dev-internal-api-key-change-me}

profile-service:
  base-url: ${PROFILE_SERVICE_URL:http://localhost:8080}
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-api-key-change-me}
  connect-timeout-ms: 2000
  read-timeout-ms: 15000

yandex:
  ocr:
    # Секреты — из mesoreal-secrets. Folder ID тоже сюда: по факту это идентификатор
    # каталога, привязанного к конкретному Yandex Cloud аккаунту/биллингу — считаем
    # его чувствительным наравне с api-key, а не публичной настройкой.
    api-key: ${YANDEX_OCR_API_KEY:}
    folder-id: ${YANDEX_FOLDER_ID:}
    poll-interval-ms: ${YANDEX_OCR_POLL_INTERVAL_MS:1000}
    # Budget for submit + poll, kept under precheck.timeout-ms so profile-service's
    # own timeout never fires first — see umc/document-verification-plan.md "Бюджет".
    poll-deadline-ms: 27000
    connect-timeout-ms: 2000
    read-timeout-ms: 10000

# Public URL other systems (amoCRM, a manager's browser) use to reach this service —
# unlike PROFILE_SERVICE_URL, this can't be the internal cluster DNS name.
integration:
  public-base-url: ${INTEGRATION_PUBLIC_BASE_URL:http://localhost:8091}

# amoCRM (Фаза 2: создание сделки; Фаза 3: приём вебхука о смене этапа).
#
# Ниже — не учётные данные, а настройки конкретного амоCRM-аккаунта (поддомен, id
# воронки/этапов/полей). Один аккаунт на весь бизнес, значения не различаются между
# test/prod — поэтому заданы прямо здесь, а не через k8s Secret. Проставляются один
# раз после настройки воронки «Проверка документов» в интерфейсе amoCRM,
# см. umc/document-verification-plan.md "amoCRM". До этого момента — пустые, вебхук/лиды
# создаваться не будут (клиенты AmoCrmClient должны считать это "не настроено").
amocrm:
  subdomain: ""
  # OAuth client id — публичный идентификатор интеграции, не секрет (в отличие от
  # client-secret ниже). Выдаётся amoCRM при регистрации интеграции.
  client-id: ""
  redirect-uri: ""
  pipeline-id: ""
  stage-approved-id: ""
  stage-rejected-id: ""
  # Comma-separated allowlist. Пусто = выключено (amoCRM не публикует фиксированный
  # список исходящих IP — заполним, когда увидим реальный трафик от вебхука).
  webhook-ip-allowlist: ""
  field-document-type-id: ""
  field-document-id-id: ""
  field-file-link-id: ""
  field-ocr-confidence-id: ""
  connect-timeout-ms: 2000
  read-timeout-ms: 10000

  # Настоящие секреты — только из mesoreal-secrets (k8s Secret), никогда не хардкодим.
  client-secret: ${AMOCRM_CLIENT_SECRET:}
  refresh-token: ${AMOCRM_REFRESH_TOKEN:}
  # Secret embedded in the webhook callback URL path itself (POST /webhooks/amocrm/documents/{secret}),
  # not a header — amoCRM's classic webhooks don't reliably sign their payload.
  webhook-secret: ${AMOCRM_WEBHOOK_SECRET:}

# Chatwoot (менеджерский чат): контакт приложения при регистрации — один телефон = один контакт,
# приложение = ещё один канал контакта (inbox «Приложение»). План:
# docs/backend/artifacts/shop/chatwoot/plan-app-contact-merge.md
chatwoot:
  enabled: ${CHATWOOT_ENABLED:false}
  base-url: ${CHATWOOT_URL:http://localhost:3000}
  account-id: ${CHATWOOT_ACCOUNT_ID:}
  # Токен отдельного сервисного пользователя-администратора Chatwoot, не личный.
  api-token: ${CHATWOOT_API_TOKEN:}
  app-inbox-name: ${CHATWOOT_APP_INBOX_NAME:Приложение}
  # Пусто — найти inbox по имени или создать.
  app-inbox-id: ${CHATWOOT_APP_INBOX_ID:}
  connect-timeout-ms: 2000
  read-timeout-ms: 10000
