spring:
  application:
    name: umc-integration-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/umc_db}
    username: ${SPRING_DATASOURCE_USERNAME:umc_user}
    password: ${SPRING_DATASOURCE_PASSWORD:umc_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:umc_user}
    password: ${SPRING_RABBITMQ_PASSWORD:umc_password}
    # Shared default vhost with profile-service — isolation is by queue-name
    # convention (profile.*, umc.*), not by RabbitMQ vhost.
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}

logging:
  level:
    root: INFO
    ru.provless.umc: DEBUG

# Shared secret authenticating inbound /internal/* requests (from profile-service).
# Same mesh-wide key already used between auth-service and phone-auth.
internal:
  api-key: ${INTERNAL_API_KEY:dev-internal-api-key-change-me}

profile-service:
  base-url: ${PROFILE_SERVICE_URL:http://localhost:8080}
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-api-key-change-me}
  connect-timeout-ms: 2000
  read-timeout-ms: 15000

yandex:
  ocr:
    api-key: ${YANDEX_OCR_API_KEY:}
    folder-id: ${YANDEX_FOLDER_ID:}
    poll-interval-ms: ${YANDEX_OCR_POLL_INTERVAL_MS:1000}
    # Budget for submit + poll, kept under precheck.timeout-ms so profile-service's
    # own timeout never fires first — see umc/document-verification-plan.md "Бюджет".
    poll-deadline-ms: 27000
    connect-timeout-ms: 2000
    read-timeout-ms: 10000

# Public URL other systems (amoCRM, a manager's browser) use to reach this service —
# unlike PROFILE_SERVICE_URL, this can't be the internal cluster DNS name.
umc:
  public-base-url: ${UMC_PUBLIC_BASE_URL:http://localhost:8091}

# amoCRM (Фаза 2: создание сделки, без вебхука — stage-approved/rejected-id и
# webhook-secret понадобятся только в Фазе 3).
amocrm:
  subdomain: ${AMOCRM_SUBDOMAIN:}
  client-id: ${AMOCRM_CLIENT_ID:}
  client-secret: ${AMOCRM_CLIENT_SECRET:}
  refresh-token: ${AMOCRM_REFRESH_TOKEN:}
  redirect-uri: ${AMOCRM_REDIRECT_URI:}
  webhook-secret: ${AMOCRM_WEBHOOK_SECRET:}
  pipeline-id: ${AMOCRM_PIPELINE_ID:}
  stage-approved-id: ${AMOCRM_STAGE_APPROVED_ID:}
  stage-rejected-id: ${AMOCRM_STAGE_REJECTED_ID:}
  # Custom field IDs on the amoCRM lead — set in amoCRM's UI, then copied here (not
  # something we can invent from code). See umc/document-verification-plan.md "amoCRM".
  field-document-type-id: ${AMOCRM_FIELD_DOCUMENT_TYPE_ID:}
  field-document-id-id: ${AMOCRM_FIELD_DOCUMENT_ID_ID:}
  field-file-link-id: ${AMOCRM_FIELD_FILE_LINK_ID:}
  field-ocr-confidence-id: ${AMOCRM_FIELD_OCR_CONFIDENCE_ID:}
  connect-timeout-ms: 2000
  read-timeout-ms: 10000
